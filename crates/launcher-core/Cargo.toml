[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "herdup core: typed wrapper over the herdr CLI"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Test double used by the integration tests. Built as a real binary so tests can
# invoke it through the same spawn path as the real `herdr`.
[[bin]]
name = "fake-herdr"
path = "src/bin/fake-herdr.rs"
