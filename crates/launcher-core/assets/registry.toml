# herdup built-in CLI registry
#
# Table keys match herdr's own agent-manifest ids (src/detect/manifests/*.toml),
# so a pane herdup launches is attributed to the right agent in herdr's sidebar.
#
# ---------------------------------------------------------------------------
# What is guessed here, and what is never guessed
# ---------------------------------------------------------------------------
#
# `binary` is BEST-EFFORT for CLIs we have not run ourselves. That is safe: a
# wrong base name fails loudly and harmlessly at preflight ("codex: not found"),
# and the user fixes it by editing one field. Verified on a real machine so far:
# claude, gemini, kimi, hermes.
#
# `flag_presets` and `briefing_trust` are NEVER guessed, because their failures
# are silent and dangerous:
#   - a wrong permission flag could disable someone's sandbox without saying so
#   - a wrong briefing_trust would let herdup type into a live prompt (spec §5.1)
# Both therefore ship empty/`manual` except where reproduced by hand.
#
# `docs_url` values come from herdr's own README agent table.
#
# briefing_trust:
#   "verified" — we reproduced the blocked -> idle transition for this CLI.
#                herdup may auto-send a briefing when the pane reports idle.
#   "manual"   — the default. Never auto-briefed; a human reviews the pane and
#                clicks Send briefing. Phase 0 caught Gemini CLI reporting idle
#                behind a blocking modal, which is why this is the default.

[claude]
display_name = "Claude Code"
binary = "claude"                                   # verified: ~/.local/bin/claude.exe
docs_url = "https://code.claude.com/docs/en/setup"
flag_presets = ["--permission-mode bypassPermissions", "--permission-mode acceptEdits", ""]
briefing_trust = "verified"                         # reproduced 2026-09-02, herdr 0.8.2
[claude.install_hint]
windows = "irm https://claude.ai/install.ps1 | iex"
unix = "curl -fsSL https://claude.ai/install.sh | bash"

