[antigravity]
display_name = "Antigravity CLI"
binary = "antigravity"
# No herdr agent kind: herdr detects it in a pane but does not manage it as an
# agent. herdup falls back to raw pane commands, which means no `agent_blocked`
# guard and therefore never any auto-briefing.
flag_presets = [""]
briefing_trust = "manual"

