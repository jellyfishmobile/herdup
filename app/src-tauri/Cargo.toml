[package]
name = "herdup-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "herdup desktop launcher"

[lib]
name = "herdup_app_lib"
# Desktop only. The Tauri template also lists `staticlib` and `cdylib` for
# mobile targets; on Windows the cdylib produced a herdup_app_lib.dll that was
# bundled into the installer and never loaded.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../../crates/launcher-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
