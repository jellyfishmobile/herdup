# Railway config for the herdup landing page.
#
# The service's root directory is `site/`, so this file is the build context
# root. There is nothing to build: the page is three static files and a
# dependency-free Node server.

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
