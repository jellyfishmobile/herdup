[workspace]
resolver = "2"
members = ["crates/launcher-core", "crates/launcher-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jellyfishmobile/herdup"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
