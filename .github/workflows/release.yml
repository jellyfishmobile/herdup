# Build installers for every platform and attach them to a GitHub Release.
#
# Windows is the only platform herdup has actually been run on. macOS and Linux
# artifacts are built here but have not been exercised by a human — the release
# notes say so, and so does the landing page. Do not quietly drop that caveat.
#
# Triggered by pushing a tag (`git tag v0.1.0 && git push origin v0.1.0`) or by
# hand from the Actions tab.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # Cheap gate: never publish installers built from a tree that fails its tests.
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tauri's Linux dependencies. webkit2gtk-4.1 is the v2 one; 4.0 is not
      # enough and fails late, during the bundle step.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: herdup ${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            Installers for Windows, macOS and Linux.

            **herdup needs [herdr](https://github.com/herdr-dev/herdr) 0.8.2 or newer
            already installed**, plus at least one agent CLI (Claude Code, Codex,
            Gemini CLI, and others). It launches them; it does not bundle them.

            Nothing here is code-signed, so Windows SmartScreen and macOS Gatekeeper
            will both warn on first run.

            Tested on Windows. The macOS and Linux builds are produced by CI but have
            not yet been run by a human — please report what breaks.
          releaseDraft: true
          prerelease: false
